<section>
<h2>اليوم 1: ما الذي تشهد به تقييماتك؟</h2>
<ol>
<li><p>واجب منزلي: مقال من 800 كلمة عن أخلاقيات المهنة. أعطيت وصفه لمساعد عام، ونال أول مخرج 72 من 100 بسلم تقديرك. أي صف هو الصحيح؟</p><ul><li><b>أ.</b> «المتعلمون يغشون في هذا الواجب»، المستوى 3</li><li><b>ب.</b> «المقال عام وسأعرفه»، المستوى 1</li><li><b>ج.</b> «الدرجة لم تعد دليلًا على أن المتعلم هو من حاجج»، المستوى 3</li><li><b>د.</b> «سأكتب أن المساعد ممنوع»، المستوى 0</li></ul></li>
<li><p>زميل في قسم يسلّم طلابه 2,000 عمل في الفصل يقول: «الأداة تخطئ في 1% فقط، فالبلاغ شبه مؤكد». أي رد يستند إلى الحساب؟</p><ul><li><b>أ.</b> المتوقع 20 بلاغًا خاطئًا في الفصل حتى لو كان الجميع نزهاء، فالبلاغ بداية سؤال لا نتيجة</li><li><b>ب.</b> 99% من البلاغات صحيحة، فنراجع واحدًا من كل مئة بلاغ فقط</li><li><b>ج.</b> الخطأ نادر وعشوائي، فلا يظلم فئة من الطلاب أكثر من غيرها</li><li><b>د.</b> نشغّل أداة ثانية، فإن اتفقتا كان البلاغ دليلًا كافيًا</li></ul></li>
<li><p>في مقرر تمريض، من ينجح يبدأ التدريب السريري الأسبوع القادم. الدرجة كلها من واجب منزلي عن حساب الجرعات كُتب عليه «يُمنع المساعد». ما التغيير الذي يجعل البوابة تشهد بما تدّعيه؟</p><ul><li><b>أ.</b> تشديد عبارة المنع وإضافة تعهد يوقّعه الطالب</li><li><b>ب.</b> تمرير الواجبات على أداة كشف قبل رصد الدرجات</li><li><b>ج.</b> إلغاء الواجبات المنزلية كلها والاكتفاء باختبار نهائي</li><li><b>د.</b> إبقاء الواجب مفتوحًا للتدرب، وإضافة حساب قصير مراقَب قبل البوابة</li></ul></li>
<li><p>سياسة مقرر تقول: «في المهام المفتوحة كل استخدام مسموح مع الإفصاح. التسليم دون إفصاح ناقص ويُستكمل. لا نتيجة على درجة أداة كشف.» طالبة سلّمت تقريرًا مفتوحًا دون إفصاح، وأعطته الأداة 90%. ما الحكم بهذه السياسة؟</p><ul><li><b>أ.</b> مخالفة: الدرجة مرتفعة جدًّا وتكفي لرصد صفر</li><li><b>ب.</b> تسليم ناقص: يُطلب منها الإفصاح والأدلة الإجرائية، ثم يُنظر</li><li><b>ج.</b> لا شيء: كل استخدام مسموح في المهام المفتوحة</li><li><b>د.</b> إحالة مباشرة إلى لجنة النزاهة لتقرر</li></ul></li>
<li><p>كلية يسلّم طلابها 5,000 عمل مكتوب في الفصل تمر كلها على أداة كشف يعلن مورّدها معدل إيجابيات كاذبة 2%. لو كان كل الطلاب نزهاء، كم بلاغًا خاطئًا يُتوقع في الفصل؟</p><ul><li><b>أ.</b> بلاغان</li><li><b>ب.</b> 100 بلاغ</li><li><b>ج.</b> 10 بلاغات</li><li><b>د.</b> لا بلاغ، لأن الجميع نزهاء</li></ul></li>
<li><p>مدرّسة وصلها بلاغ من أداة كشف معدل إيجابياتها الكاذبة المعلن 1%. تسأل: «ما احتمال أن الطالب بريء؟» ما الذي ينقصها لتحسب؟</p><ul><li><b>أ.</b> لا شيء: الاحتمال 1%</li><li><b>ب.</b> عدد كلمات التقرير فقط</li><li><b>ج.</b> معدل الالتقاط الحقيقي، ونسبة من استخدموا المساعد في الدفعة</li><li><b>د.</b> درجة أداة كشف ثانية</li></ul></li>
<li><p>في قسم يدرّس بالإنجليزية طلابًا أغلبهم يكتبونها لغةً ثانية، تقترح اللجنة اعتماد درجة أداة الكشف «قرينة أولية». أي اعتراض تسنده الأدلة المنشورة؟</p><ul><li><b>أ.</b> الأدوات تعلّم نصوص من يكتبون بلغة ثانية أكثر من غيرها، فالقرينة تقع على فئة بعينها</li><li><b>ب.</b> الأدوات لا تعمل على النصوص الإنجليزية أصلًا</li><li><b>ج.</b> الأدوات تعلّم النصوص الطويلة فقط</li><li><b>د.</b> الطلاب سيتوقفون عن الكتابة بالإنجليزية</li></ul></li>
<li><p>شعبة من 40 طالبًا نزيهًا، وأداة معدل إيجابياتها الكاذبة 1%. مدرّس يقول: «0.4 بلاغ أقل من واحد، فلن يُتهم أحد». ما التصحيح؟</p><ul><li><b>أ.</b> صحيح: أقل من واحد يعني صفرًا</li><li><b>ب.</b> الصحيح 4 بلاغات</li><li><b>ج.</b> لا يمكن حساب شيء لشعبة صغيرة</li><li><b>د.</b> احتمال بلاغ خاطئ واحد على الأقل نحو الثلث في كل فصل</li></ul></li>
<li><p>واجب منزلي في مقرر محاسبة: حل ثماني مسائل قيود. أعطيت الوصف لمساعد عام فنال أول مخرج 55 من 100 بسلم تقديرك، وحد النجاح 50. ما مستوى الانكشاف على مقياس الورشة؟</p><ul><li><b>أ.</b> 0: لأن الدرجة ضعيفة</li><li><b>ب.</b> 1: يساعد دون أن ينجح</li><li><b>ج.</b> 2: ينجح دون تعديل</li><li><b>د.</b> 3: ينال درجة جيدة دون تعديل</li></ul></li>
<li><p>مدرّس يكتب في عمود «ما تشهد به الدرجة» لمهمة عرض تقديمي: «العروض التقديمية». ما الخلل؟</p><ul><li><b>أ.</b> كتب موضوعًا لا مهارة: المطلوب جملة فعلها ما يستطيعه المتعلم</li><li><b>ب.</b> الجملة قصيرة جدًّا</li><li><b>ج.</b> لم يذكر وزن المهمة</li><li><b>د.</b> لم يذكر اسم المساعد المستخدم</li></ul></li>
<li><p>تريد أن تختبر صمود مهمة كتابة تقرير مختبر. أي إجراء يطابق طريقة الورشة؟</p><ul><li><b>أ.</b> تلصق تقرير طالب متميز وتسأل المساعد هل يستطيع كتابة مثله</li><li><b>ب.</b> تحسّن المخرج بنفسك ثم تصححه</li><li><b>ج.</b> تسأل المساعد: هل تستطيع حل هذه المهمة؟ وتسجّل جوابه</li><li><b>د.</b> تلصق وصف المهمة كما يصل إلى الطالب، وتصحح أول مخرج بسلم التقدير</li></ul></li>
<li><p>اختبار نهائي مراقَب من أسئلة تعريفات، في مقرر توصيفه يقول إن الخريج «يشخّص أعطال الدوائر». مستوى انكشافه 0. ماذا يكتب المدقق في العمود الأخير؟</p><ul><li><b>أ.</b> لا شيء: المستوى 0 يعني أن المهمة سليمة</li><li><b>ب.</b> صامد أمام المساعد، لكنه يشهد بالاستحضار لا بالتشخيص</li><li><b>ج.</b> يجب رفع مستواه إلى 1 احتياطًا</li><li><b>د.</b> يجب إلغاؤه لأنه لا يستخدم الذكاء الاصطناعي</li></ul></li>
<li><p>مقرر برمجة في السنة الأولى، ومن ينجح فيه يسجّل في مقرر يفترض أنه يكتب دوال بسيطة وحده. الدرجة كلها من مشاريع منزلية. ما أقل تغيير يجعل البوابة تشهد بما تدّعيه؟</p><ul><li><b>أ.</b> مهمة برمجة قصيرة مراقَبة في القاعة قبل نهاية المقرر، والمشاريع تبقى مفتوحة</li><li><b>ب.</b> منع المساعد في المشاريع المنزلية</li><li><b>ج.</b> تحويل كل المشاريع إلى اختبارات مراقَبة</li><li><b>د.</b> فحص المشاريع بأداة كشف الشيفرة المولَّدة</li></ul></li>
<li><p>مدرّس يضع واجبًا منزليًّا عليه «يُسمح بالمساعد للعصف الذهني فقط» في المسار المؤمَّن. ما الاعتراض؟</p><ul><li><b>أ.</b> العصف الذهني لا يفيد المتعلم</li><li><b>ب.</b> المسار المؤمَّن لا يقبل الواجبات المكتوبة</li><li><b>ج.</b> الواجب المنزلي لا يراه أحد، فالقيد لا يُنفَّذ والمهمة مفتوحة مهما كُتب عليها</li><li><b>د.</b> يجب أن يُسمح بالمساعد في كل شيء دائمًا</li></ul></li>
<li><p>سياسة مقرر فيها: «يُسمح بالاستعانة المعقولة بالذكاء الاصطناعي». طالب استخدم مساعدًا لتلخيص خمسة مراجع ثم كتب بنفسه وأفصح. زميلان يطبقان السياسة فيختلفان. ما الإصلاح؟</p><ul><li><b>أ.</b> إضافة «جدًّا» بعد «المعقولة»</li><li><b>ب.</b> كتابة ما يُسمح به صراحة، وما يسلَّم معه، وعلام تكون الدرجة</li><li><b>ج.</b> ترك الحكم للمدرّس في كل حالة</li><li><b>د.</b> منع المساعد في المقرر كله</li></ul></li>
<li><p>تصنّف مهام مقرر على مقياس من خمسة مستويات لاستخدام الذكاء الاصطناعي. مهمة مفتوحة تقيّم كيف قوّم الطالب مخرج المساعد وعدّله. أي تصنيف يصفها؟</p><ul><li><b>أ.</b> 1 · دون ذكاء اصطناعي</li><li><b>ب.</b> 2 · التخطيط بالذكاء الاصطناعي</li><li><b>ج.</b> 5 · استكشاف بالذكاء الاصطناعي</li><li><b>د.</b> 3 · التعاون مع الذكاء الاصطناعي</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: أدلة لا يكتبها أحد عن المتعلم</h2>
<ol>
<li><p>في مهمة مفتوحة وصلتك درجة 85% من أداة كشف على تقرير أُرفق معه إفصاح كامل وسجل محادثة. بسياسة من خمسة بنود كالتي كتبتها أمس، ما الخطوة؟</p><ul><li><b>أ.</b> محادثة مع الطالب عن سبب ارتفاع الدرجة</li><li><b>ب.</b> لا خطوة: المهمة مفتوحة والإفصاح كامل، والدرجة ليست ملاحظة</li><li><b>ج.</b> تشغيل أداة ثانية للتأكد قبل أي قرار</li><li><b>د.</b> إعادة المهمة في القاعة تحت المراقبة</li></ul></li>
<li><p>سجل إصدارات مقال من 900 كلمة: جلسة واحدة من ست دقائق، وإدراج واحد من 880 كلمة. بيان الإفصاح: «لم أستخدم أي مساعد». أي سطر يصلح في ورقة الملاحظات؟</p><ul><li><b>أ.</b> «المقال مولَّد بمساعد، والإفصاح كاذب»</li><li><b>ب.</b> «لا شيء يُذكر: الطالب أفصح بأنه لم يستخدم مساعدًا»</li><li><b>ج.</b> «إدراج واحد؛ تُطلب درجة أداة الكشف لحسم المسألة»</li><li><b>د.</b> «880 كلمة أُدرجت دفعة واحدة؛ لا يثبت مصدرها؛ أسأله أين كتبها وعن اختيارين فيها»</li></ul></li>
<li><p>متدربة شرحت اختياراتها وذكرت ما استبعدته، وطبّقت على الحالة الجديدة بضابط مناسب، ووصفت عمليتها بما يطابق سجلها. تكلمت ببطء، وبجمل قصيرة، وطلبت وقتًا قبل كل جواب. ما التقييم الذي يتبع السلم؟</p><ul><li><b>أ.</b> درجة عالية: كل معيار في السلم تحقق، والبطء ليس معيارًا</li><li><b>ب.</b> درجة متوسطة: الإجابات صحيحة لكن التردد يدل على ضعف التمكن</li><li><b>ج.</b> درجة معلّقة: طلب الوقت قبل كل جواب يستدعي اختبارًا ثانيًا</li><li><b>د.</b> درجة منخفضة: لم تُظهر ثقة مهنية في العرض</li></ul></li>
<li><p>واجب مكشوف في مقرر تسويق: «اكتب خطة تسويقية لمنتج من اختيارك في 1,500 كلمة». أي بديل ينقل الدرجة إلى الحكم والعملية والمناقشة؟</p><ul><li><b>أ.</b> الخطة نفسها في 3,000 كلمة مع خمسة عشر مرجعًا</li><li><b>ب.</b> الخطة نفسها لمنتج سعودي معروف بدل منتج من اختياره</li><li><b>ج.</b> من بيانات مبيعات مقصف الكلية: اختر قناتين من أربع بميزانية محددة، وانقد خطة مساعد، وناقش اختيارك</li><li><b>د.</b> الخطة نفسها مع تعهد موقّع بعدم استخدام أي مساعد</li></ul></li>
<li><p>أعدت اختبار واجبك الجديد. نال مخرج المساعد 41 من 100، وحد النجاح 60. منها 14 من 15 في معيار «تعريف المفاهيم الأساسية». ما الخطوة التالية؟</p><ul><li><b>أ.</b> العودة إلى الواجب القديم، لأن الجديد لم يمنع المساعد من نيل درجات</li><li><b>ب.</b> حذف معيار التعريفات أو إنقاص وزنه، ونقل الوزن إلى الحكم أو الدليل الإجرائي</li><li><b>ج.</b> لا شيء: المجموع دون حد النجاح والتصميم اكتمل</li><li><b>د.</b> إضافة عبارة تمنع استخدام المساعد في قسم التعريفات</li></ul></li>
<li><p>سجل إصدارات تقرير يُظهر إدراجًا واحدًا من 900 كلمة في جلسة من ثلاث دقائق. ما الذي يثبته؟</p><ul><li><b>أ.</b> أن الطالب استخدم مساعدًا</li><li><b>ب.</b> أن الطالب لم يكتب التقرير</li><li><b>ج.</b> أن النص وُضع في المستند دفعة واحدة، وهذا سؤال يُطرح على الطالب</li><li><b>د.</b> لا شيء، فيُهمل</li></ul></li>
<li><p>تصمم اختبارًا شفهيًّا من خمس دقائق على تقارير الطلاب. أي تصميم يقيس الفهم ولا يقيس الطلاقة؟</p><ul><li><b>أ.</b> ثلاثة أسئلة تُطرح معًا ليجيب الطالب عنها بالترتيب الذي يريد</li><li><b>ب.</b> الأسئلة نفسها لكل الطلاب بالترتيب نفسه</li><li><b>ج.</b> سؤال واحد في كل مرة، ولحظة تفكير، وحالة جديدة تُسحب أمام الطالب</li><li><b>د.</b> تقييم حسب سرعة الإجابة وثقة الطالب</li></ul></li>
<li><p>طالب يتلعثم بشدة يطلب بديلًا للاختبار الشفهي الصوتي. أي بديل يحافظ على ما يشهد به الاختبار؟</p><ul><li><b>أ.</b> إعفاؤه من الاختبار ورصد درجة تقريره</li><li><b>ب.</b> الأسئلة نفسها والوقت نفسه، يجيب عنها كتابةً أمام المقيِّم</li><li><b>ج.</b> إرسال الأسئلة إليه ليجيب عنها في البيت</li><li><b>د.</b> اختبار كتابي مختلف أطول وأصعب</li></ul></li>
<li><p>تسليمان: الأول كُتب على خمس جلسات مع سجل محادثة مرفق، وأعطته أداة الكشف 71%. الثاني أُدرج دفعة واحدة دون سجل، وأعطته 12%. بمن تبدأ المحادثة، ولماذا؟</p><ul><li><b>أ.</b> بالأول، لأن درجته أعلى</li><li><b>ب.</b> بالثاني، لأن سجله يُظهر إدراجًا واحدًا وإفصاحه ناقص</li><li><b>ج.</b> بلا أحد: الأداة برّأت الثاني والسجل برّأ الأول</li><li><b>د.</b> بالاثنين معًا أمام الشعبة</li></ul></li>
<li><p>واجب مكشوف: «اكتب مقالًا من 1,000 كلمة عن مزايا الطاقة الشمسية وعيوبها». أي إعادة تصميم تضيف الروافع الثلاث معًا؟</p><ul><li><b>أ.</b> المقال نفسه من 2,000 كلمة مع عشرة مراجع</li><li><b>ب.</b> المقال نفسه مع منع المساعد</li><li><b>ج.</b> من فاتورة مبنى الكلية المرفقة: اختر بين عرضين للألواح تحت ميزانية، وانقد توصية مساعد، ودافع عن اختيارك</li><li><b>د.</b> المقال نفسه بخط اليد</li></ul></li>
<li><p>سلم تقدير لواجب معاد تصميمه: اللغة والتنسيق 30، المحتوى 40، المراجع 30. ما المشكلة؟</p><ul><li><b>أ.</b> المجموع لا يساوي 100</li><li><b>ب.</b> كل الوزن على منتج نهائي يناله المساعد، ولا شيء للحكم والعملية والمناقشة</li><li><b>ج.</b> وزن المراجع قليل</li><li><b>د.</b> يجب حذف المحتوى من السلم</li></ul></li>
<li><p>أعدت اختبار وصفك الجديد بمساعد فنال مخرجه 34 من 100، منها 9 من 10 في معيار «خلفية نظرية». ما القراءة الصحيحة؟</p><ul><li><b>أ.</b> التصميم فشل لأن المساعد نال درجات</li><li><b>ب.</b> التصميم نجح ولا شيء يُصلح</li><li><b>ج.</b> يجب منع المساعد في هذه المهمة</li><li><b>د.</b> المخرج دون النجاح، ومعيار الخلفية ما زال مكشوفًا: يُحذف أو يُنقل وزنه إلى الحكم</li></ul></li>
<li><p>في مراجعة خطة تقييمك يسألك المراجع: «لماذا أبقيت الاختبارات الأسبوعية وهي مكشوفة تمامًا؟» أي جواب يدافع عن اختيار؟</p><ul><li><b>أ.</b> «لأنها كانت دائمًا في المقرر»</li><li><b>ب.</b> «نقلتها إلى المسار المفتوح بوزن رمزي للتدرب، والشهادة بالمعرفة صارت في مهمة مؤمَّنة قبل البوابة»</li><li><b>ج.</b> «سأشغّل عليها أداة كشف»</li><li><b>د.</b> «الطلاب وعدوا ألا يستخدموا المساعد»</li></ul></li>
</ol>
